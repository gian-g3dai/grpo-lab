# ARC pilot on an H100 (80 GB): Qwen2.5-7B-Instruct, bf16 LoRA (no quantization), same task, rewards
# and recipe as qwen2.5-1.5b-arc-pilot.yaml. NOT yet run; the numbers are estimates.
# Expected ~30-35 GB peak with all 32 rollouts in one generate() call and a loss micro-batch of 4.
# Qwen2.5-14B-Instruct should also fit this card (~55 GB) with generation_batch_size: 16 and
# per_device_train_batch_size: 2. `use_vllm: true` is the next speed lever; not validated in this repo.
run_name: qwen2.5-7b-arc-h100
model: Qwen/Qwen2.5-7B-Instruct
task: arc

data:
  n_tasks: 50                 # ARC-1 training tasks, chosen by `select`
  select: smallest            # by median re-arc sample size -> short prompts
  samples_per_task: 200       # fresh re-arc prompts per task (10,000 total, we see max_steps*4 of them)
  n_demos: 3                  # demo pairs per prompt
  holdout_per_task: 20        # re-arc samples per task reserved for post-training eval
  max_prompt_cells: 2000      # skip prompts bigger than this (~tokens); memory is not the constraint here
  max_output_cells: 300       # skip queries whose output grid is bigger than this

rewards: [arc_exact, arc_partial, arc_format]

lora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

grpo:
  model_init_kwargs: {dtype: bfloat16}   # TRL loads the policy in fp32 unless told otherwise
  num_generations: 8
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8      # 32 completions = 4 prompts per optimizer step
  generation_batch_size: 32           # all 32 rollouts in one generate() call: HF generate is per-token-latency bound
  max_completion_length: 384          # gold grids are <= 300 tokens; longer = rambling
  temperature: 1.0
  beta: 0.0
  epsilon: 0.2
  scale_rewards: group
  learning_rate: 2.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  max_grad_norm: 0.5
  max_steps: 100
  gradient_checkpointing: true
  bf16: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 50
  save_total_limit: 1
  report_to: none
  seed: 0
